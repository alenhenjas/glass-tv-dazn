plugins { id 'com.android.application' }
android {
    namespace 'com.alen.glass'
    compileSdk 34
    defaultConfig {
        applicationId 'com.alen.glass'
        minSdk 24
        targetSdk 28  // 28: api wi-fi classiche (connessione diretta alle reti) e api bluetooth
        versionCode 35
        versionName '5.7'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
